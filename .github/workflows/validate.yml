name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate structure and publication hygiene
        run: python scripts/validate.py
      - name: Validate synthetic smoke cases
        run: python scripts/smoke.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
